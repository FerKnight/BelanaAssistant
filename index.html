<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BelanaAssistant - Mongil: Star Dive</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#0b0f17',
              card: '#131b2e',
              border: '#1e293b',
              accent: '#38bdf8'
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-brand-bg text-slate-100 min-h-screen flex flex-col font-sans selection:bg-cyan-500 selection:text-white pb-20 sm:pb-0">

  <!-- CABECERA PRINCIPAL / NAVBAR -->
  <header class="bg-brand-card/90 backdrop-blur-md border-b border-brand-border sticky top-0 z-40 px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="navigateTo('home')">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center font-black text-white shadow-lg shadow-cyan-500/20">
          B
        </div>
        <div>
          <h1 class="text-base font-extrabold text-white leading-none">BelanaAssistant</h1>
          <p class="text-[10px] text-cyan-400 font-semibold tracking-wide">Mongil: Star Dive</p>
        </div>
      </div>

      <!-- NAVEGACIÓN DESKTOP -->
      <nav class="hidden sm:flex items-center space-x-1">
        <button onclick="navigateTo('home')" id="nav-desk-home" class="px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 text-slate-400 hover:text-white hover:bg-slate-800">
          <i data-lucide="home" class="w-4 h-4"></i>
          <span>Inicio</span>
        </button>
        <button onclick="navigateTo('characters')" id="nav-desk-characters" class="px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 text-slate-400 hover:text-white hover:bg-slate-800">
          <i data-lucide="users" class="w-4 h-4"></i>
          <span>Personajes</span>
        </button>
        <button onclick="navigateTo('artifacts')" id="nav-desk-artifacts" class="px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 text-slate-400 hover:text-white hover:bg-slate-800">
          <i data-lucide="gem" class="w-4 h-4"></i>
          <span>Artefactos</span>
        </button>
        <button onclick="navigateTo('equipments')" id="nav-desk-equipments" class="px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 text-slate-400 hover:text-white hover:bg-slate-800">
          <i data-lucide="shield" class="w-4 h-4"></i>
          <span>Equipamientos</span>
        </button>
        <button onclick="navigateTo('monsterlings')" id="nav-desk-monsterlings" class="px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1.5 text-slate-400 hover:text-white hover:bg-slate-800">
          <i data-lucide="bug" class="w-4 h-4"></i>
          <span>Monsterlings</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- CONTENEDOR DE CONTENIDO DINÁMICO -->
  <main id="app-root" class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6">
    <!-- El módulo activo se renderiza aquí dinámicamente -->
  </main>

  <!-- NAVEGACIÓN INFERIOR MÓVIL (PWA FIRST) -->
  <nav class="sm:hidden fixed bottom-0 left-0 right-0 bg-brand-card/95 backdrop-blur-lg border-t border-brand-border z-40 px-2 py-2 flex items-center justify-around">
    <button onclick="navigateTo('home')" id="nav-mob-home" class="flex flex-col items-center justify-center py-1 px-2 rounded-xl text-slate-400 hover:text-white transition">
      <i data-lucide="home" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold mt-0.5">Inicio</span>
    </button>
    <button onclick="navigateTo('characters')" id="nav-mob-characters" class="flex flex-col items-center justify-center py-1 px-2 rounded-xl text-slate-400 hover:text-white transition">
      <i data-lucide="users" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold mt-0.5">Personajes</span>
    </button>
    <button onclick="navigateTo('artifacts')" id="nav-mob-artifacts" class="flex flex-col items-center justify-center py-1 px-2 rounded-xl text-slate-400 hover:text-white transition">
      <i data-lucide="gem" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold mt-0.5">Artefactos</span>
    </button>
    <button onclick="navigateTo('equipments')" id="nav-mob-equipments" class="flex flex-col items-center justify-center py-1 px-2 rounded-xl text-slate-400 hover:text-white transition">
      <i data-lucide="shield" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold mt-0.5">Equipamiento</span>
    </button>
    <button onclick="navigateTo('monsterlings')" id="nav-mob-monsterlings" class="flex flex-col items-center justify-center py-1 px-2 rounded-xl text-slate-400 hover:text-white transition">
      <i data-lucide="bug" class="w-5 h-5"></i>
      <span class="text-[10px] font-bold mt-0.5">Monsterlings</span>
    </button>
  </nav>

  <!-- MODAL PRINCIPAL CONTENEDOR -->
  <div id="modal-container" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-brand-card border border-brand-border rounded-2xl max-w-lg w-full p-5 space-y-4 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1 rounded-lg bg-slate-800/50 z-20">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <!-- FUNCIONES GLOBALES DE MODAL -->
  <script>
    function closeModal() {
      const modal = document.getElementById('modal-container');
      if (modal) modal.classList.add('hidden');
    }
  </script>

  <!-- 1. CARGA DE DATOS MODULARES INDEPENDIENTES -->
  <script src="js/data/characters_db.js"></script>
  <script src="js/data/artifacts_db.js"></script>
  <script src="js/data/equipments_db.js"></script>
  <script src="js/data/monsterlings_db.js"></script>
  
  <!-- 2. BASE DE DATOS GENERAL Y CONTROLADORES DE SECCIÓN -->
  <script src="js/db.js"></script>
  <script src="js/home.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/equipments.js"></script>
  <script src="js/monsterlings.js"></script>
  <script src="js/artifacts.js"></script>
  
  <!-- 3. APLICACIÓN PRINCIPAL Y NAVEGACIÓN -->
  <script src="js/app.js"></script>
</body>
</html>
