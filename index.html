<!-- MODAL CAMBIAR AVATAR -->
  <div id="profile-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-brand-card border border-brand-border rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl relative">
      <button onclick="closeProfileModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1 rounded-lg bg-slate-800/50">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <h3 class="text-xl font-bold text-white flex items-center space-x-2">
        <i data-lucide="user-cog" class="text-cyan-400 w-5 h-5"></i>
        <span>Seleccionar Avatar</span>
      </h3>

      <div class="space-y-3">
        <label class="block text-xs font-semibold text-slate-400">Elige un personaje de tu colección:</label>
        <div class="grid grid-cols-3 sm:grid-cols-4 gap-3 max-h-64 overflow-y-auto p-1 pr-2 scrollbar-none" id="avatar-selector-container"></div>
      </div>
    </div>
  </div>
