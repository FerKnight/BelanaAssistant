<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="theme-color" content="#090d16">

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Estilos e Iconos -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

      darkMode: 'class',

        extend: {
          colors: {
            brand: {
              bg: '#090d16',
              card: '#111827',
              border: '#1f293d',
              cyan: '#06b6d4',

</head>
<body class="bg-brand-bg text-slate-100 font-sans min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-black">

    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
      
      <!-- Botón Abrir Menú Lateral -->
      <div class="flex items-center space-x-3">
        <button onclick="toggleDrawer(true)" class="p-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-cyan-400 transition active:scale-95">
          <i data-lucide="menu" class="w-6 h-6"></i>
        </button>

  <aside id="drawer-menu" class="fixed top-0 left-0 h-full w-72 bg-slate-900 border-r border-brand-border z-50 -translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between shadow-2xl">

  <!-- MODAL EDITAR PERFIL -->

        <i data-lucide="x" class="w-5 h-5"></i>

      <h3 class="text-xl font-bold text-white flex items-center space-x-2">
        <i data-lucide="user-cog" class="text-cyan-400 w-5 h-5"></i>
        <span>Editar Perfil de Jugador</span>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-2">Seleccionar Avatar (Retratos de Personajes):</label>
          <div class="grid grid-cols-3 sm:grid-cols-4 gap-3 max-h-48 overflow-y-auto p-1 scrollbar-none" id="avatar-selector-container"></div>
        </div>

        <!-- Nombre de Usuario -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Nombre de Comandante:</label>
          <input type="text" id="input-username" class="w-full bg-slate-900 border border-brand-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-cyan-400">
        </div>

        <!-- Código de Amistad -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Código de Amistad:</label>
          <input type="text" id="input-friend-code" placeholder="EJ: MSD-9982-1042" class="w-full bg-slate-900 border border-brand-border rounded-xl px-3 py-2 text-sm font-mono text-cyan-400 focus:outline-none focus:border-cyan-400">
        </div>

      <button onclick="saveUserProfile()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-bold py-2.5 rounded-xl text-sm transition shadow-lg shadow-cyan-500/20">

  <!-- MODAL DE DETALLES GENERAL -->
  <div id="modal-container" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-brand-card border border-brand-border rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative">
      <button onclick="closeModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1 rounded-lg bg-slate-800/50">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>
      <div id="modal-content"></div>
    </div>

    <p>© 2026 BelanaAssistant. Guía PWA para Mongil Star Dive.</p>

      ]
    };

    // Ruta unificada para los retratos de los personajes
    function getPortraitPath(slug) {
      return `assets/images/Character_Portrait/portrait_${slug}_00.png`;
    }

    // =======================================================
    // 2. GESTIÓN DE PERFIL DE USUARIO
    // =======================================================
    let userProfile = JSON.parse(localStorage.getItem('belana_user_profile')) || {
      name: 'Comandante',
      friendCode: 'MSD-7741-9023',
      avatar: getPortraitPath(DB.characters[0].slug)
    };

    let tempSelectedAvatar = userProfile.avatar;

    function saveUserProfile() {
      const newName = document.getElementById('input-username').value.trim();
      const newCode = document.getElementById('input-friend-code').value.trim();

      if (newName) userProfile.name = newName;
      if (newCode) userProfile.friendCode = newCode;
      userProfile.avatar = tempSelectedAvatar;

      localStorage.setItem('belana_user_profile', JSON.stringify(userProfile));
      closeProfileModal();
      navigate(activeModule);
    }

    function openProfileModal() {
      document.getElementById('input-username').value = userProfile.name;
      document.getElementById('input-friend-code').value = userProfile.friendCode;
      tempSelectedAvatar = userProfile.avatar;
      renderAvatarSelector();
      document.getElementById('profile-modal').classList.remove('hidden');
    }

    function closeProfileModal() {
      document.getElementById('profile-modal').classList.add('hidden');
    }

    function renderAvatarSelector() {
      const container = document.getElementById('avatar-selector-container');
      container.innerHTML = DB.characters.map(char => {
        const portrait = getPortraitPath(char.slug);
        const isSelected = tempSelectedAvatar === portrait;
        return `
          <div onclick="selectAvatar('${portrait}')" class="cursor-pointer border-2 ${isSelected ? 'border-cyan-400 bg-cyan-500/10' : 'border-brand-border bg-slate-900'} rounded-xl p-1.5 transition text-center group">
            <img src="${portrait}" onerror="this.src='${DEFAULT_AVATAR}'" class="w-12 h-12 rounded-lg mx-auto object-cover mb-1 group-hover:scale-105 transition">
            <span class="text-[10px] text-slate-300 font-semibold block truncate">${char.name}</span>
          </div>`;
      }).join('');
    }

    function selectAvatar(path) {
      tempSelectedAvatar = path;
      renderAvatarSelector();
    }

    function copyFriendCode() {
      navigator.clipboard.writeText(userProfile.friendCode);
      alert('¡Código de amistad copiado al portapapeles!');
    }

    // 3. MÓDULOS DE NAVEGACIÓN
    // =======================================================

                    <img src="${userProfile.avatar}" onerror="this.src='${DEFAULT_AVATAR}'" class="w-20 h-20 rounded-2xl border-2 border-cyan-400 object-cover shadow-lg shadow-cyan-500/20">

                    </button>
                  </div>
                  <div>
                    <span class="text-xs text-cyan-400 font-mono tracking-wider uppercase font-semibold">Perfil de Jugador</span>
                    <h2 class="text-2xl font-black text-white">${userProfile.name}</h2>
                    <div class="flex items-center justify-center sm:justify-start space-x-2 mt-1">
                      <span class="bg-slate-900 border border-brand-border px-2.5 py-1 rounded-lg text-xs font-mono text-slate-300">
                        ${userProfile.friendCode}
                      </span>
                      <button onclick="copyFriendCode()" title="Copiar Código" class="p-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-cyan-400 transition">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                      </button>
                    </div>
                  </div>
                </div>

                <button onclick="openProfileModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-brand-border px-4 py-2 rounded-xl text-xs font-semibold transition flex items-center space-x-2">
                  <i data-lucide="user-cog" class="w-4 h-4 text-cyan-400"></i>
                  <span>Editar Perfil</span>
                </button>
              </div>
            </section>

            <section class="relative overflow-hidden rounded-3xl border border-brand-border bg-gradient-to-br from-slate-900 via-slate-900/90 to-indigo-950/50 p-8 shadow-2xl">

                  <i data-lucide="bot" class="w-3.5 h-3.5"></i>
                  <span>BelanaAssistant v1.4</span>
                </div>
                <h1 class="text-2xl md:text-4xl font-black text-white leading-tight">
                  Explora las Estrellas en <span class="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-purple-400">Mongil Star Dive</span>
                </h1>
                <p class="text-slate-400 text-sm">
                  Usa el menú lateral para consultar personajes, equipamientos, monsterlings y conjuntos de artefactos.
                </p>
                <button onclick="toggleDrawer(true)" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-5 py-2.5 rounded-xl text-sm transition flex items-center space-x-2 shadow-lg shadow-cyan-500/20">
                  <i data-lucide="menu" class="w-4 h-4"></i>
                  <span>Abrir Menú de Navegación</span>
                </button>
              </div>
            </section>
          </div>`
      },
      characters: {
        title: 'Personajes',
        icon: 'users',
        render: () => `
          <div class="space-y-6">
            <h2 class="text-2xl font-bold text-white flex items-center space-x-2">
              <i data-lucide="users" class="text-cyan-400 w-6 h-6"></i>
              <span>Directorio de Personajes</span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              ${DB.characters.map(c => {
                const portrait = getPortraitPath(c.slug);
                return `
                  <div onclick="openModal('${c.name}', '${c.element}', '${c.role}', '${c.skills}', '${c.desc}', '${portrait}')" class="bg-brand-card border border-brand-border p-5 rounded-xl hover:border-cyan-500/50 cursor-pointer transition flex space-x-4 items-center">
                    <img src="${portrait}" onerror="this.src='${DEFAULT_AVATAR}'" class="w-16 h-16 rounded-xl object-cover border border-brand-border flex-shrink-0">
                    <div class="flex-grow min-w-0">
                      <div class="flex justify-between items-start mb-1">
                        <h3 class="font-bold text-base text-white truncate">${c.name}</h3>
                        <span class="bg-indigo-500/20 text-indigo-300 text-[10px] px-2 py-0.5 rounded font-bold">${c.tier}</span>

              }).join('')}
            </div>
          </div>`
      },
      equipments: {
        title: 'Equipamientos',
        icon: 'shield',
        render: () => `
          <div class="space-y-6">
            <h2 class="text-2xl font-bold text-white flex items-center space-x-2">
              <i data-lucide="shield" class="text-cyan-400 w-6 h-6"></i>
              <span>Catálogo de Equipamiento</span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${DB.equipments.map(e => `
                <div class="bg-brand-card border border-brand-border p-5 rounded-xl space-y-2">
                  <div class="flex justify-between items-center">
                    <h3 class="font-bold text-lg text-white">${e.name}</h3>
                    <span class="bg-amber-500/20 text-amber-300 text-xs px-2 py-0.5 rounded font-bold">${e.rarity}</span>
                  </div>
                  <p class="text-xs text-slate-400">Ranura: ${e.slot} | Atributo: <span class="text-amber-400 font-semibold">${e.stat}</span></p>
                  <p class="text-sm text-slate-300">${e.effect}</p>
                </div>
              `).join('')}
            </div>
          </div>`
      },
      monsterlings: {
        title: 'Monsterlings',
        icon: 'bug',
        render: () => `
          <div class="space-y-6">
            <h2 class="text-2xl font-bold text-white flex items-center space-x-2">
              <i data-lucide="bug" class="text-purple-400 w-6 h-6"></i>
              <span>Guía de Monsterlings</span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${DB.monsterlings.map(m => `
                <div class="bg-brand-card border border-brand-border p-5 rounded-xl space-y-2">
                  <div class="flex justify-between items-center">
                    <h3 class="font-bold text-lg text-white">${m.name}</h3>
                    <span class="bg-purple-500/20 text-purple-300 text-xs px-2 py-0.5 rounded">${m.type}</span>
                  </div>
                  <p class="text-xs text-slate-400">Hábitat: <span class="text-purple-400">${m.habitat}</span></p>
                  <p class="text-xs text-slate-300"><strong class="text-cyan-400">Pasiva:</strong> ${m.passive}</p>
                  <p class="text-xs text-slate-300"><strong class="text-indigo-400">Activa:</strong> ${m.active}</p>
                </div>
              `).join('')}
            </div>
          </div>`
      },
      artifacts: {
        title: 'Artefactos',
        icon: 'gem',
        render: () => `
          <div class="space-y-6">
            <h2 class="text-2xl font-bold text-white flex items-center space-x-2">
              <i data-lucide="gem" class="text-amber-400 w-6 h-6"></i>
              <span>Conjuntos de Artefactos</span>
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              ${DB.artifacts.map(a => `
                <div class="bg-brand-card border border-brand-border p-5 rounded-xl space-y-3">
                  <h3 class="font-bold text-lg text-white">${a.name}</h3>
                  <span class="inline-block bg-slate-800 text-slate-300 text-xs px-2 py-0.5 rounded">${a.type}</span>
                  <div class="space-y-1 text-xs">
                    <p class="text-slate-300"><strong class="text-amber-400">Efecto 2 Pcs:</strong> ${a.bonus2}</p>
                    <p class="text-slate-300"><strong class="text-amber-400">Efecto 4 Pcs:</strong> ${a.bonus4}</p>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>`
      }
    };

    // =======================================================
    // 4. ENRUTADOR Y CONTROL DE MENÚ
    // =======================================================
    let activeModule = 'home';

    function toggleDrawer(open) {
      const drawer = document.getElementById('drawer-menu');
      const overlay = document.getElementById('drawer-overlay');
      if (open) {
        drawer.classList.remove('-translate-x-full');
        overlay.classList.remove('opacity-0', 'pointer-events-none');
      } else {
        drawer.classList.add('-translate-x-full');
        overlay.classList.add('opacity-0', 'pointer-events-none');
      }
    }

    function navigate(key) {
      if (!Modules[key]) return;
      activeModule = key;
      document.getElementById('app-content').innerHTML = Modules[key].render();
      renderDrawerNav();
      toggleDrawer(false);
      lucide.createIcons();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderDrawerNav() {
      const container = document.getElementById('drawer-nav-container');
      container.innerHTML = Object.keys(Modules).map(key => {
        const mod = Modules[key];
        const isActive = key === activeModule;
        return `
          <button onclick="navigate('${key}')" class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-semibold transition ${isActive ? 'bg-cyan-500/10 text-cyan-400 border border-cyan-500/30' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}">
            <i data-lucide="${mod.icon}" class="w-5 h-5"></i>
            <span>${mod.title}</span>
          </button>`;
      }).join('');
    }

    // Modal Manager
    function openModal(title, element, role, skills, desc, portrait) {
      const modal = document.getElementById('modal-container');
      const content = document.getElementById('modal-content');
      content.innerHTML = `
        <div class="flex items-center space-x-4 mb-3">
          <img src="${portrait}" onerror="this.src='${DEFAULT_AVATAR}'" class="w-16 h-16 rounded-xl object-cover border border-cyan-400 flex-shrink-0">
          <div>
            <h3 class="text-2xl font-bold text-white">${title}</h3>
            <p class="text-xs text-cyan-400">Elemento: ${element} | Tipo: ${role}</p>
          </div>
        </div>
        <div class="space-y-3 text-sm text-slate-300">
          <p><strong>Descripción:</strong> ${desc}</p>
          <div class="p-3 bg-slate-900 rounded-lg border border-slate-800">
            <strong class="text-indigo-400 block mb-1">Habilidad Especial:</strong>
            ${skills}
          </div>
        </div>`;
      modal.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-container').classList.add('hidden');
    }

    // Inicialización
    navigate('home');

    // Registro PWA & Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW Error:', err));
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btn = document.getElementById('pwa-install-btn');
      if (btn) {
        btn.classList.remove('hidden');
        btn.addEventListener('click', () => {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(() => btn.classList.add('hidden'));
        });
      }
    });
  </script>
</body>
</html>
